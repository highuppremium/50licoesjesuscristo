<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — 50 Lições: Aprenda com Jesus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Caveat:wght@600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf8ff; --section:#d8f1ff; --card:#fff;
  --blue:#27b8ff; --blue2:#087deb; --deep:#102a43;
  --text:#17324a; --muted:#58758c; --green:#0b9f68; --sun:#ffb703;
  --line:#b8e5ff; --shadow:0 8px 24px rgba(8,125,235,.14);
  --f-title:'Fredoka','Trebuchet MS',Arial,sans-serif;
  --f-hand:'Caveat','Comic Sans MS',cursive;
  --f-body:'Nunito',Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:linear-gradient(180deg,#c9efff 0%,var(--bg) 70%);color:var(--text);font-family:var(--f-body);line-height:1.6;overflow-x:hidden;position:relative}
img{max-width:100%;height:auto;display:block}
h1,h2,h3,p{margin-top:0}
h1,h2,h3{font-family:var(--f-title);color:var(--deep)}
p{color:var(--muted)}
.grad{background:linear-gradient(135deg,var(--blue),var(--blue2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hand{font-family:var(--f-hand);font-weight:700;color:var(--blue2);font-size:1.25em}
.green{color:var(--green)}

/* fundo decorativo (igual ao hero da landing) */
.blob{position:fixed;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(255,255,255,0) 70%);z-index:0;animation:drift 9s ease-in-out infinite;pointer-events:none}
.blob.a{width:260px;height:260px;left:-60px;top:60px}
.blob.b{width:340px;height:340px;right:-90px;bottom:40px;animation-delay:-4s}
@keyframes drift{50%{transform:translate(30px,20px)}}

.wrap{position:relative;z-index:1;width:min(640px,92%);margin:0 auto;padding:26px 0 48px}
.brand{text-align:center;font-family:var(--f-hand);font-size:28px;font-weight:700;color:var(--blue2);line-height:1;margin-bottom:14px}

/* progresso */
.progress{margin-bottom:18px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:14px;color:var(--muted);margin-bottom:8px}
.progress-top b{color:var(--deep);font-family:var(--f-title);font-size:16px;font-weight:600}
.bar{display:flex;gap:6px}
.seg{flex:1;height:10px;border-radius:10px;background:#fff;border:2px solid var(--line);overflow:hidden;position:relative}
.seg:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--blue),var(--blue2));transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.3,1.2,.5,1)}
.seg.done:after{transform:scaleX(1)}

/* cartão */
.card{background:#fff;border:3px solid var(--line);border-radius:26px;padding:30px 26px 26px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;right:0;height:7px;background:linear-gradient(90deg,var(--blue),var(--blue2))}
.step{animation:in .45s cubic-bezier(.3,1.1,.5,1)}
.step.out{animation:out .25s ease-in forwards}
@keyframes in{from{opacity:0;transform:translateX(34px)}}
@keyframes out{to{opacity:0;transform:translateX(-34px)}}
.tag{display:inline-block;font-family:var(--f-hand);font-size:24px;font-weight:700;color:var(--blue2);line-height:1;margin-bottom:6px}
.q{font-size:clamp(24px,5.4vw,32px);line-height:1.15;font-weight:700;margin-bottom:8px}
.hint{font-size:15px;margin-bottom:20px}

/* respostas */
.opts{display:grid;gap:14px}
.opt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;font:inherit;background:#fff;border:3px solid var(--line);border-radius:20px;padding:16px 18px;cursor:pointer;color:var(--text);transition:transform .2s,border-color .2s,box-shadow .2s,background .2s}
.opt:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:var(--shadow)}
.opt:focus-visible{outline:3px solid var(--blue2);outline-offset:3px}
.opt .emo{flex:none;width:58px;height:58px;border-radius:18px;background:#d9f3ff;display:grid;place-items:center;font-size:30px}
.opt b{display:block;font-family:var(--f-title);font-size:19px;font-weight:600;color:var(--deep);line-height:1.2}
.opt span.sub{display:block;font-size:14px;color:var(--muted);margin-top:2px;line-height:1.35}
.opt.sel{background:linear-gradient(145deg,var(--blue),var(--blue2));border-color:transparent;transform:scale(1.02);box-shadow:0 12px 26px rgba(8,125,235,.35)}
.opt.sel b,.opt.sel .sub{color:#fff}
.opt.sel .emo{background:rgba(255,255,255,.22)}
.opts.locked .opt:not(.sel){opacity:.5}
.opts.locked{pointer-events:none}

.back{display:inline-flex;align-items:center;gap:6px;margin-top:18px;background:none;border:0;font:inherit;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer;padding:6px 4px;border-radius:8px}
.back:hover{color:var(--blue2)}
.back:focus-visible{outline:3px solid var(--blue2)}
.back[hidden]{display:none}

/* analisando */
.loading{text-align:center;padding:26px 0 18px}
.spinner{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;border:7px solid #d9f3ff;border-top-color:var(--blue2);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading h2{font-size:24px;margin-bottom:6px}
.loading ul{list-style:none;padding:0;margin:16px auto 0;max-width:300px;text-align:left}
.loading li{display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px;color:var(--muted);opacity:.35;transition:opacity .4s,color .4s;margin:8px 0}
.loading li:before{content:"○";font-weight:900;color:var(--line)}
.loading li.on{opacity:1;color:var(--deep)}
.loading li.on:before{content:"✓";color:#07834f;background:#c9f7e4;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:13px}

/* resultado */
.result{text-align:center}
.result h2{font-size:clamp(26px,5.6vw,36px);line-height:1.1;margin-bottom:10px}
.result .lead{font-size:17px;margin-bottom:16px}
.result .lead b{color:var(--blue2)}
.res-img{width:min(380px,100%);margin:6px auto 14px;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 14px 20px rgba(8,125,235,.25))}
@keyframes float{50%{transform:translateY(-10px) rotate(.6deg)}}
.recap{background:#f1faff;border:2px dashed var(--line);border-radius:18px;padding:14px 16px;margin:0 0 16px;text-align:left}
.recap-t{font-family:var(--f-hand);font-size:22px;font-weight:700;color:var(--blue2);line-height:1;margin-bottom:8px;display:block}
.recap ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.recap li{background:#fff;border:2px solid var(--line);border-radius:30px;padding:5px 13px;font-size:13px;font-weight:800;color:var(--blue2)}
.checklist{list-style:none;padding:0;margin:0 auto 18px;text-align:left;max-width:420px}
.checklist li{margin:10px 0;padding-left:34px;position:relative;color:var(--text);font-weight:600;font-size:15px;line-height:1.4}
.checklist li:before{content:"✓";position:absolute;left:0;top:0;background:#c9f7e4;color:#07834f;font-weight:900;border-radius:50%;width:24px;height:24px;text-align:center;line-height:24px}
.btn{display:flex;align-items:center;justify-content:center;font-family:var(--f-title);font-size:18px;letter-spacing:.02em;color:#fff;text-decoration:none;font-weight:600;padding:17px 26px;border-radius:14px;background:linear-gradient(135deg,#0cb879,#078c5b);box-shadow:0 7px 18px rgba(11,159,104,.32);transition:transform .2s,box-shadow .2s;animation:pulseg 2.6s infinite}
.btn:hover,.btn:focus-visible{transform:translateY(-3px) scale(1.02);box-shadow:0 12px 26px rgba(11,159,104,.4);outline:none}
@keyframes pulseg{0%{box-shadow:0 0 0 0 rgba(12,184,121,.55)}70%,100%{box-shadow:0 0 0 16px rgba(12,184,121,0)}}
.small{font-size:13px;margin:12px 0 0}
.link{display:inline-block;margin-top:10px;font-weight:800;font-size:14px;color:var(--blue2);text-decoration:none}
.link:hover{text-decoration:underline}

@media(max-width:480px){
  .card{padding:26px 16px 20px;border-radius:22px}
  .opt{padding:13px 13px;gap:12px}
  .opt .emo{width:50px;height:50px;font-size:26px;border-radius:15px}
  .opt b{font-size:17px}
  .blob{display:none}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<span class="blob a"></span><span class="blob b"></span>

<main class="wrap">
  <div class="brand">50 Lições ♥</div>

  <div class="progress" id="progress" aria-label="Progresso do quiz">
    <div class="progress-top"><span>Quiz rápido</span><b id="count">Etapa 1 de 4</b></div>
    <div class="bar" id="bar"><i class="seg"></i><i class="seg"></i><i class="seg"></i><i class="seg"></i></div>
  </div>

  <div class="card"><div id="stage" aria-live="polite"></div>
    <button class="back" id="back" type="button" hidden>← Voltar</button>
  </div>
</main>

<script>
/* ============ CONFIGURAÇÃO ============ */
var LINK_LANDING = 'landing.html'; // nome do arquivo da sua landing page (o antigo index.html renomeado)
var IMG_PRODUTO = 'images/v2-principal.webp'; // mesma imagem do topo da landing

var STEPS = [
  { tag:'Para começar',
    q:'Para quem você quer levar os ensinamentos de Jesus?',
    hint:'Escolha a opção que mais combina com você.',
    opts:[
      { emo:'🙋', t:'Para mim mesmo(a)', s:'Meu crescimento pessoal e espiritual', chip:'Crescer na fé' },
      { emo:'👨‍👩‍👧', t:'Para minha família', s:'Filhos, cônjuge ou quem vive comigo', chip:'Ensinar em família' }
    ]},
  { tag:'Seu momento',
    q:'O que mais dificulta esse hábito hoje?',
    hint:'Seja sincero(a), é a resposta que mais ajuda.',
    opts:[
      { emo:'⏳', t:'Falta de tempo e constância', s:'A rotina corrida faz tudo ficar para depois', chip:'Rotina corrida' },
      { emo:'🤔', t:'Não sei como explicar de forma simples', s:'Falta um caminho claro para começar', chip:'Falta de um caminho claro' }
    ]},
  { tag:'Seu desejo',
    q:'O que você mais gostaria de viver daqui pra frente?',
    hint:'Imagine daqui a alguns meses.',
    opts:[
      { emo:'🧭', t:'Decisões guiadas pelos valores de Jesus', s:'Saber como agir em cada situação', chip:'Decidir como Jesus' },
      { emo:'💬', t:'Conversas e momentos que marcam', s:'Mais conexão e propósito no dia a dia', chip:'Momentos que marcam' }
    ]},
  { tag:'A solução',
    q:'Qual formato ajudaria mais você a começar?',
    hint:'Última pergunta!',
    opts:[
      { emo:'📅', t:'Lições curtas, uma de cada vez', s:'No meu ritmo, sem pressão', chip:'Lições no seu ritmo' },
      { emo:'🎨', t:'Conteúdo ilustrado e visual', s:'Fácil de entender e gostoso de acompanhar', chip:'Material ilustrado' }
    ]}
];

/* ============ LÓGICA ============ */
var stage = document.getElementById('stage');
var backBtn = document.getElementById('back');
var count = document.getElementById('count');
var segs = document.querySelectorAll('.seg');
var answers = [];
var current = 0;
var busy = false;

function track(name, data){ try{ if(window.fbq) fbq('trackCustom', name, data||{}); }catch(e){} }

function setProgress(n){ // n = etapas concluídas
  segs.forEach(function(s,i){ s.classList.toggle('done', i < n); });
  count.textContent = n >= 4 ? 'Quase lá!' : 'Etapa ' + (n+1) + ' de 4';
}

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }

function renderStep(i){
  var d = STEPS[i];
  setProgress(i);
  backBtn.hidden = i === 0;
  var html = '<div class="step">' +
    '<span class="tag">' + esc(d.tag) + '</span>' +
    '<h1 class="q">' + esc(d.q) + '</h1>' +
    '<p class="hint">' + esc(d.hint) + '</p>' +
    '<div class="opts">';
  d.opts.forEach(function(o, k){
    html += '<button type="button" class="opt" data-k="' + k + '">' +
      '<span class="emo" aria-hidden="true">' + o.emo + '</span>' +
      '<span><b>' + esc(o.t) + '</b><span class="sub">' + esc(o.s) + '</span></span></button>';
  });
  html += '</div></div>';
  stage.innerHTML = html;
  stage.querySelectorAll('.opt').forEach(function(b){
    b.addEventListener('click', function(){ choose(i, +b.getAttribute('data-k'), b); });
  });
  track('Quiz_Etapa_' + (i+1));
}

function choose(i, k, btn){
  if(busy) return; busy = true;
  answers[i] = k;
  btn.classList.add('sel');
  btn.parentNode.classList.add('locked');
  segs[i].classList.add('done');
  setTimeout(function(){
    var el = stage.querySelector('.step');
    el.classList.add('out');
    setTimeout(function(){
      busy = false;
      if(i < STEPS.length - 1){ current = i + 1; renderStep(current); }
      else { analyze(); }
    }, 250);
  }, 380);
}

backBtn.addEventListener('click', function(){
  if(busy || current === 0) return;
  current--; renderStep(current);
});

function analyze(){
  backBtn.hidden = true;
  setProgress(4);
  stage.innerHTML = '<div class="step loading">' +
    '<div class="spinner" aria-hidden="true"></div>' +
    '<h2>Analisando suas respostas…</h2><p>Preparando a melhor indicação para você.</p>' +
    '<ul><li>Seu perfil</li><li>Seus desafios</li><li>Seus objetivos</li></ul></div>';
  var lis = stage.querySelectorAll('li');
  lis.forEach(function(li, n){ setTimeout(function(){ li.classList.add('on'); }, 500 + n*650); });
  setTimeout(showResult, 2700);
}

function showResult(){
  var chips = answers.map(function(k, i){ return '<li>' + esc(STEPS[i].opts[k].chip) + '</li>'; }).join('');
  stage.innerHTML = '<div class="step result">' +
    '<span class="tag">Resultado pronto ♥</span>' +
    '<h2>O <span class="grad">50 Lições</span> foi feito para o seu momento</h2>' +
    '<img class="res-img" src="' + IMG_PRODUTO + '" alt="Material 50 Lições ilustrado" onerror="this.style.display=\'none\'">' +
    '<div class="recap"><span class="recap-t">O que você nos contou</span><ul>' + chips + '</ul></div>' +
    '<p class="lead">Seja qual for o seu ponto de partida, as <b>50 lições ilustradas</b> mostram <b>como Jesus agiria em cada situação</b> de um jeito <b>simples, visual e prático</b>, para você viver e ensinar seus valores no seu ritmo.</p>' +
    '<ul class="checklist">' +
      '<li>Serve para o seu dia a dia e para conversar em família</li>' +
      '<li>Lições curtas, que cabem na sua rotina</li>' +
      '<li>Ilustrações que explicam tudo de forma clara</li>' +
      '<li>Acesso digital imediato, direto no celular ou computador</li>' +
    '</ul>' +
    '<a class="btn" id="cta" href="' + LINK_LANDING + '">QUERO CONHECER O MATERIAL</a>' +
    '<p class="small">Veja todos os detalhes e decida com calma</p>' +
    '</div>';
  count.textContent = 'Resultado';
  track('Quiz_Resultado', { respostas: answers.join('') });
  document.getElementById('cta').addEventListener('click', function(){
    track('Quiz_CliqueLanding', { respostas: answers.join('') });
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

renderStep(0);
</script>
</body>
</html>
